name: GoReleaser

# Runs when release-please publishes a GitHub Release (i.e. after the Release
# PR is merged and the tag + Release object are created). GoReleaser builds
# multi-platform binaries, signs the checksums, and uploads all assets to the
# existing GitHub Release.
on:
  release:
    types:
      - published

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser needs the full git history to identify commits belonging
          # to this release.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      # Import the RSA/DSA GPG private key stored in repository secrets.
      # The Terraform Registry rejects ECC (ed25519) keys — make sure the
      # key you generate and upload is RSA or DSA.
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # release-please already created the GitHub Release; --skip=validate
          # tells GoReleaser not to re-validate the tag, and it will upload
          # assets to the existing release rather than creating a new one.
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
