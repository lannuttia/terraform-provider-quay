name: Tests

on:
  pull_request:
    paths-ignore:
      - "README.md"
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"

permissions:
  contents: read

jobs:
  # ── Schema validation ─────────────────────────────────────────────────────
  schema:
    name: Schema Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate GitHub workflow files
        run: pipx run check-jsonschema==0.38.2 --builtin-schema vendor.github-workflows .github/workflows/*.yml

      - name: Require timeout-minutes on all jobs
        run: pipx run check-jsonschema==0.38.2 --builtin-schema custom.github-workflows-require-timeout .github/workflows/*.yml

  # ── Build & lint (via Nix dev shell) ─────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # required for magic-nix-cache FlakeHub authentication
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Build
        run: nix develop --command go build -v .

      - name: Lint
        run: nix develop --command golangci-lint run

  # ── Vet & unit tests (via Nix dev shell) ─────────────────────────────────
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # required for magic-nix-cache FlakeHub authentication
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Vet
        run: nix develop --command go vet ./...

      - name: Unit tests (with race detection)
        run: nix develop --command go test -race -v -count=1 -timeout 120s ./internal/client/...

      # Provider schema-validation tests run without TF_ACC and need no live Quay.
      - name: Provider schema tests (with race detection)
        run: nix develop --command go test -race -v -count=1 -timeout 120s ./internal/provider/...

  # ── Acceptance tests against a live Quay testcontainer ───────────────────
  #
  # These jobs intentionally do not use the Nix dev shell — their purpose is
  # to verify compatibility across multiple Terraform CLI versions, which the
  # flake does not model. Go is sourced from go.mod via actions/setup-go.
  acceptance:
    name: "Acceptance Tests: Terraform ${{ matrix.terraform }}"
    needs: build
    runs-on: ubuntu-latest
    # Quay takes 2-5 minutes to start; tests themselves add more.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        terraform:
          - "1.13.*"
          - "1.14.*"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false

      - run: go mod download

      # testcontainers-go uses the Docker socket on the runner.
      # ubuntu-latest runners have Docker pre-installed.
      - name: Acceptance tests (with race detection)
        env:
          TF_ACC: "1"
          # QUAY_URL and QUAY_TOKEN are intentionally not set here —
          # TestMain will spin up the Quay testcontainer automatically.
          #
          # To run tests against an existing Quay instance instead, set:
          # QUAY_URL: ${{ secrets.QUAY_URL }}
          # QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
        run: go test -race -v -count=1 -timeout 20m ./internal/provider/...
