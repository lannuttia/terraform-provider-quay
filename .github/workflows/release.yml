name: Release

# ── Release PR management ───────────────────────────────────────────────────
#
# release-please runs after Tests pass on main. It scans conventional commits
# since the last tag, updates CHANGELOG.md, and opens (or updates) a Release
# PR. When that PR is merged, release-please creates the git tag and GitHub
# Release, which triggers the goreleaser workflow below.
on:
  workflow_run:
    workflows:
      - Tests
    branches:
      - main
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  # ── Guard: only proceed when Tests succeeded ───────────────────────────────
  check:
    name: Check workflow result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_release: ${{ steps.guard.outputs.should_release }}
    steps:
      - name: Guard on success
        id: guard
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "Triggering workflow did not succeed (conclusion: ${{ github.event.workflow_run.conclusion }}). Skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  # ── Release PR management ──────────────────────────────────────────────────
  release-please:
    name: Release Please
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@a02a34c4d625f9be7cb89156071d8567266a2445 # v4.2.0
        with:
          # RELASE_PLEASE_TOKEN is a fine-grained PAT with Contents (write)
          # and Pull requests (write) scopes. Using a PAT means the PR is
          # opened under a real user identity, which allows pull_request_target
          # workflows (e.g. Validate PR title) to trigger on release PRs.
          # GITHUB_TOKEN is blocked from triggering those workflows on its own
          # PRs to prevent recursive automation loops.
          token: ${{ secrets.RELASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
