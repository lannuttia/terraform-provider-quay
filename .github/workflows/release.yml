name: Release

# Runs after Tests pass on main. release-please manages the Release PR and,
# when that PR is merged, creates the git tag and GitHub Release. GoReleaser
# then builds multi-platform binaries, signs checksums, and uploads all assets
# to the existing GitHub Release.
#
# Both jobs run in the same workflow so that the release_created and tag_name
# outputs from release-please are available to goreleaser in the same run.
# GoReleaser uses release.mode: keep-existing in .goreleaser.yml so it uploads
# assets without overwriting the release notes that release-please wrote.
on:
  workflow_run:
    workflows:
      - Tests
    branches:
      - main
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  id-token: write
  attestations: write

jobs:
  # ── Guard: only proceed when Tests succeeded ───────────────────────────────
  check:
    name: Check workflow result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_release: ${{ steps.guard.outputs.should_release }}
    steps:
      - name: Guard on success
        id: guard
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "Triggering workflow did not succeed (conclusion: ${{ github.event.workflow_run.conclusion }}). Skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  # ── Release PR management ──────────────────────────────────────────────────
  release-please:
    name: Release Please
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@a02a34c4d625f9be7cb89156071d8567266a2445 # v4.2.0
        id: release
        with:
          # RELASE_PLEASE_TOKEN is a fine-grained PAT with Contents (write)
          # and Pull requests (write) scopes. Using a PAT means the PR is
          # opened under a real user identity, which allows pull_request_target
          # workflows (e.g. Validate PR title) to trigger on release PRs.
          # GITHUB_TOKEN is blocked from triggering those workflows on its own
          # PRs to prevent recursive automation loops.
          token: ${{ secrets.RELASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # ── Multi-platform build & publish ────────────────────────────────────────
  goreleaser:
    name: GoReleaser
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      # Import the RSA/DSA GPG private key stored in repository secrets.
      # The Terraform Registry rejects ECC (ed25519) keys — make sure the
      # key you generate and upload is RSA or DSA.
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
