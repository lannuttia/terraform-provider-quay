name: Release

# Waits for the Tests and Snyk workflows to pass on main before running
# release-please. This ensures we never cut a release from a broken commit.
#
# workflow_run is the only mechanism that creates a cross-workflow ordering
# dependency within the same repository. Both named workflows must complete
# successfully (conclusion == success) for this workflow to start.
on:
  workflow_run:
    workflows:
      - Tests
      - Snyk
    branches:
      - main
    types:
      - completed

# release-please needs write access to open/update the Release PR and create
# tags. goreleaser needs it to upload release assets. id-token and attestations
# are required for build provenance attestation.
permissions:
  contents: write
  pull-requests: write
  id-token: write
  attestations: write

jobs:
  # ── Guard: only proceed when all triggering workflows succeeded ───────────
  #
  # workflow_run fires on every completion (success *and* failure). This job
  # exits early if the triggering run did not succeed, so release-please and
  # goreleaser never run on a broken commit.
  check:
    name: Check workflow result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_release: ${{ steps.guard.outputs.should_release }}
    steps:
      - name: Guard on success
        id: guard
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "Triggering workflow did not succeed (conclusion: ${{ github.event.workflow_run.conclusion }}). Skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  # ── Release PR management ─────────────────────────────────────────────────
  #
  # release-please scans conventional commits since the last tag, computes
  # the next SemVer, updates CHANGELOG.md, and opens (or updates) a Release PR.
  # When that PR is merged, it creates the git tag and then sets
  # release_created=true so the goreleaser job below can run.
  #
  # skip-github-release=true means release-please only creates the tag and
  # updates CHANGELOG.md — it does NOT create the GitHub Release object.
  # goreleaser owns that responsibility, which avoids asset-upload race
  # conditions between the two tools.
  #
  release-please:
    name: Release Please
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@a02a34c4d625f9be7cb89156071d8567266a2445 # v4.2.0
        id: release
        with:
          # RELEASE_PLEASE_TOKEN is a fine-grained PAT with Contents (write)
          # and Pull requests (write) scopes. Using a PAT means the PR is
          # opened under a real user identity, which allows pull_request_target
          # workflows (e.g. Validate PR title) to trigger on release PRs.
          # GITHUB_TOKEN is blocked from triggering those workflows on its own
          # PRs to prevent recursive automation loops.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # goreleaser creates the GitHub Release; release-please only tags.
          skip-github-release: true

  # ── Multi-platform build & publish ───────────────────────────────────────
  #
  # Runs only when release-please just created a new tag (i.e. the Release PR
  # was merged). goreleaser builds binaries for all target platforms, signs
  # the checksums, and creates the GitHub Release with all assets.
  goreleaser:
    name: GoReleaser
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser needs the full git history to build changelogs and to
          # identify commits belonging to this release.
          fetch-depth: 0
          # Check out the exact tag release-please just created.
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      # Import the RSA/DSA GPG private key stored in repository secrets.
      # The Terraform Registry rejects ECC (ed25519) keys — make sure the
      # key you generate and upload is RSA or DSA.
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: release --clean
        env:
          # GITHUB_TOKEN is automatically provided by GitHub Actions.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GPG_FINGERPRINT comes from the import_gpg step above and is
          # referenced in .goreleaser.yml signs[].args.
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
